name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  workflow_dispatch:
  schedule:
    - cron: "24 9 * * 1"

permissions:
  contents: read

env:
  PYTHONPATH: src
  UV_CACHE_DIR: /tmp/rad_rebuild_uv_cache

jobs:
  tests:
    name: Tests Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install app/development checkout
        run: python -m pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q tests

  baseline:
    name: Baseline Python 3.12
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install app/development checkout
        run: python -m pip install -e ".[dev]"
      - name: Install JavaScript tools
        run: npm ci
      - name: Run durable baseline
        run: python scripts/dev/baseline.py
      - name: Run browser smoke tests
        run: npm run test:browser

  package:
    name: Package Smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install build tools
        run: python -m pip install -e ".[build]"
      - name: Build package
        run: python -m build
      - name: Check metadata and imports
        run: |
          python -m pip install --force-reinstall dist/horticulture_lighting_simulator-*.whl
          python -c "import importlib.metadata as md; dist = md.distribution('horticulture-lighting-simulator'); assert dist.metadata['Name'] == 'horticulture-lighting-simulator'; assert {'rad-rebuild-dev', 'rad-rebuild-web', 'rad-rebuild-radiance-api'} <= {entry.name for entry in dist.entry_points}; import rad_rebuild, rad_rebuild.dev, rad_rebuild.web.app, rad_rebuild.radiance.backend.server; assert rad_rebuild.__version__"

  lock-and-exports:
    name: Lock And Requirements
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - name: Install uv
        run: python -m pip install "uv==0.11.21"
      - name: Check uv.lock is current
        run: uv lock --check
      - name: Check generated requirements exports
        run: |
          uv export --frozen --format requirements.txt --extra web --extra api --extra scientific --no-dev --no-emit-project --output-file requirements.txt
          uv export --frozen --format requirements.txt --extra scientific --extra live-radiance --no-dev --no-emit-project --output-file docker/radiance/requirements.runtime.txt
          git diff --exit-code -- requirements.txt docker/radiance/requirements.runtime.txt

  radiance-docker:
    name: Radiance Docker Smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Build and smoke-test Radiance runtime image
        run: python3 scripts/dev/radiance_docker_smoke.py

  dependency-audit:
    name: Scheduled Dependency Audit
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pip-audit
        run: python -m pip install -e ".[security]"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Run dependency audits
        run: python scripts/dev/dependency_audit.py

  diff-check:
    name: Diff Check
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7
      - name: Check whitespace
        run: git diff --check
