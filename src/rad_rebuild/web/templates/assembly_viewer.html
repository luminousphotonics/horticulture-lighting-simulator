<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive 3D assembly viewer for Horticulture Lighting Simulator.">
  <title>Horticulture Lighting Simulator 3D Assembly Viewer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/assembly-viewer.css') }}">
</head>

<body>
  <main class="assembly-viewer" data-viewer-root>
    <section class="assembly-viewer__viewport" aria-label="3D assembly viewport">
      <canvas id="assembly-canvas"></canvas>
      <div class="assembly-viewer__toolbar">
        <div>
          <p class="assembly-viewer__eyebrow">3D Assembly</p>
          <h1 id="assembly-title">Lighting System</h1>
        </div>
        <div class="assembly-viewer__heatmap-controls" aria-label="PPFD heatmap controls">
          <label class="assembly-viewer__toggle">
            <input id="assembly-heatmap-toggle" type="checkbox" disabled>
            <span>PPFD heatmap</span>
          </label>
          <label class="assembly-viewer__opacity">
            <span>Opacity</span>
            <input id="assembly-heatmap-opacity" type="range" min="0.15" max="1" step="0.05" value="0.72" disabled>
          </label>
          <span id="assembly-heatmap-status" class="assembly-viewer__heatmap-status" aria-live="polite">Idle</span>
        </div>
        <div class="assembly-viewer__fixture-controls" aria-label="Fixture display controls">
          <label class="assembly-viewer__toggle">
            <input id="assembly-fixtures-toggle" type="checkbox" checked disabled>
            <span>Show fixtures</span>
          </label>
          <label class="assembly-viewer__height-control" for="assembly-fixture-height">
            <span>Fixture height</span>
            <input id="assembly-fixture-height" type="range" min="-0.3" max="1.2" step="0.01" value="0" disabled>
          </label>
          <output id="assembly-fixture-height-value" for="assembly-fixture-height">0.00 m</output>
          <button id="assembly-fixture-height-reset" type="button" disabled>Reset Height</button>
        </div>
        <div id="assembly-plants-control" class="assembly-viewer__plant-controls" aria-label="Plant display controls" hidden>
          <label class="assembly-viewer__toggle">
            <input id="assembly-plants-toggle" type="checkbox" checked disabled>
            <span>Show plants</span>
          </label>
          <label class="assembly-viewer__toggle">
            <input id="assembly-plants-color-toggle" type="checkbox" checked disabled>
            <span>Surface-flux color</span>
          </label>
          <label class="assembly-viewer__select">
            <span>Plant color</span>
            <select id="assembly-plants-color-mode" disabled>
              <option value="target_range">Target range</option>
              <option value="raw_leaf_surface_flux">Raw leaf-surface flux</option>
            </select>
          </label>
          <span id="assembly-plants-status" class="assembly-viewer__plant-status">0 leaves</span>
          <span id="assembly-plants-legend" class="assembly-viewer__plant-legend" hidden></span>
        </div>
        <div class="assembly-viewer__actions">
          <button id="assembly-fspm-toggle" type="button" aria-controls="assembly-fspm-panel" aria-expanded="false" hidden>
            Show FSPM Panel
          </button>
          <button id="assembly-reset-camera" type="button">Reset Camera</button>
        </div>
      </div>
      <div class="assembly-viewer__status" aria-live="polite">
        <p id="assembly-status">Loading assembly scene...</p>
        <dl>
          <div>
            <dt>Mode</dt>
            <dd id="assembly-mode">-</dd>
          </div>
          <div>
            <dt>Room</dt>
            <dd id="assembly-room">-</dd>
          </div>
          <div>
            <dt>Instances</dt>
            <dd id="assembly-count">-</dd>
          </div>
        </dl>
      </div>
      <div id="assembly-perf" class="assembly-viewer__perf" hidden></div>
      <div id="assembly-heatmap-tooltip" class="assembly-viewer__heatmap-tooltip" role="status" aria-live="polite" hidden></div>
      <aside id="assembly-fspm-panel" class="assembly-viewer__fspm-panel" aria-label="FSPM Panel" hidden>
        <div class="assembly-viewer__fspm-header">
          <h2>FSPM Panel</h2>
          <button id="assembly-fspm-export" type="button" disabled hidden>Export Data</button>
        </div>
        <p id="assembly-fspm-export-status" class="assembly-viewer__fspm-export-status" aria-live="polite" hidden></p>
        <div id="assembly-fspm-content" class="assembly-viewer__fspm-content"></div>
      </aside>
    </section>
  </main>

  <script type="module" src="{{ url_for('static', filename='js/assembly-viewer/main.js') }}"></script>
</body>

</html>
